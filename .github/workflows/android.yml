name: Build Lineage Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      # ==========================================
      # STEP 1: Audit disk before ANY cleanup
      # ==========================================
      - name: Audit disk usage
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h /
          echo ""
          echo "=== Top 20 largest directories in / ==="
          sudo du -hx --max-depth=1 / 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== /usr breakdown ==="
          sudo du -hx --max-depth=1 /usr 2>/dev/null | sort -hr | head -15
          echo ""
          echo "=== /opt breakdown ==="
          sudo du -hx --max-depth=1 /opt 2>/dev/null | sort -hr | head -15
          echo ""
          echo "=== Memory + Swap ==="
          free -h
          swapon --show

      # ==========================================
      # STEP 2: Manual cleanup (no maximize-build-space)
      # ==========================================
      - name: Free space manually
        run: |
          sudo rm -rf /usr/local/lib/android      || true
          sudo rm -rf /usr/local/share/boost      || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium   || true
          sudo rm -rf /usr/local/aws-cli          || true
          sudo rm -rf /usr/local/.ghcup           || true
          sudo rm -rf /opt/hostedtoolcache        || true
          sudo rm -rf /opt/microsoft              || true
          sudo rm -rf /opt/az                     || true
          sudo rm -rf /opt/google                 || true
          sudo rm -rf /opt/pipx                   || true
          sudo rm -rf /opt/actionarchivecache     || true
          sudo rm -rf /opt/runner-cache           || true
          sudo rm -rf /opt/mssql-tools            || true
          sudo rm -rf /opt/hca                    || true
          sudo rm -rf /usr/share/dotnet           || true
          sudo rm -rf /usr/share/swift            || true
          sudo rm -rf /usr/share/miniconda        || true
          sudo rm -rf /usr/share/gradle           || true
          sudo rm -rf /usr/share/php              || true
          sudo rm -rf /usr/share/kotlin           || true
          sudo rm -rf /usr/share/java             || true
          sudo rm -rf /usr/lib/google-cloud-sdk   || true
          sudo rm -rf /usr/lib/jvm                || true
          sudo rm -rf /usr/lib/firefox            || true
          sudo rm -rf /usr/lib/mono               || true
          sudo docker image prune -a -f 2>/dev/null || true
          sudo docker system prune -a -f 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/* 2>/dev/null || true
          echo "=== Disk AFTER cleanup ==="
          df -h /

      # ==========================================
      # STEP 3: Verify swap (runner already has it)
      # ==========================================
      - name: Verify swap
        run: |
          echo "=== Existing swap ==="
          swapon --show
          echo ""
          echo "=== Memory ==="
          free -h
          echo ""
          echo "=== Disk ==="
          df -h /

      # ==========================================
      # STEP 4: Install build dependencies
      # ==========================================
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-11-jdk
          echo "=== Disk after deps ==="
          df -h /

      # ==========================================
      # STEP 5: Install repo tool
      # ==========================================
      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # ==========================================
      # STEP 6: Configure git and TMPDIR (NO ccache)
      # ==========================================
      - name: Configure git and TMPDIR
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "TMPDIR=$HOME/lineage/tmp" >> $GITHUB_ENV
          echo "TEMP=$HOME/lineage/tmp" >> $GITHUB_ENV
          echo "TMP=$HOME/lineage/tmp" >> $GITHUB_ENV

      # ==========================================
      # STEP 7: Init LineageOS 20.0
      # ==========================================
      - name: Init LineageOS 20.0
        run: |
          mkdir -p ~/lineage/tmp
          cd ~/lineage
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-tags
          echo "=== Disk after init ==="
          df -h /

      # ==========================================
      # STEP 8: Checkout device tree
      # ==========================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: _device_tree

      - name: Place device tree
        run: |
          mkdir -p ~/lineage/device/infinix/X6525
          cp -a _device_tree/. ~/lineage/device/infinix/X6525/
          echo "=== Device tree files ==="
          ls -la ~/lineage/device/infinix/X6525/

      # ==========================================
      # STEP 9: Sync sources
      # ==========================================
      - name: Sync sources
        run: |
          cd ~/lineage
          mkdir -p ~/lineage/tmp
          export TMPDIR=$HOME/lineage/tmp
          echo "=== Disk BEFORE sync ==="
          df -h /
          repo sync -c -j4 \
            --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune || \
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          echo "=== Disk AFTER sync ==="
          df -h /
          du -sh .repo/

      # ==========================================
      # STEP 10: Free space after sync
      # ==========================================
      - name: Free space after sync
        run: |
          cd ~/lineage
          echo "=== Before cleanup ==="
          df -h /
          # Remove git pack files we don't need for the build
          find .repo/projects -name "*.pack" -delete 2>/dev/null || true
          find .repo/projects -name "*.idx" -delete 2>/dev/null || true
          find .repo/project-objects -name "*.pack" -delete 2>/dev/null || true
          find .repo/project-objects -name "*.idx" -delete 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      # ==========================================
      # STEP 11: Prepare kernel/dtb/dtbo
      # ==========================================
      - name: Prepare kernel
        run: |
          cd ~/lineage/device/infinix/X6525/prebuilts
          if [ -f kernel.gz ]; then
            echo "Decompressing kernel.gz..."
            gunzip -f kernel.gz
          fi
          echo "=== prebuilts contents ==="
          ls -la
          echo "=== kernel type ==="
          file kernel || true
          echo "=== dtb type ==="
          file dtb.img || true
          echo "=== dtbo type ==="
          file dtbo.img || true
          echo "=== modules count ==="
          ls modules_recovery_ramdisk/*.ko 2>/dev/null | wc -l

      # ==========================================
      # STEP 12: Build Lineage Recovery (-j2, NO ccache)
      # ==========================================
      - name: Build Lineage Recovery
        run: |
          cd ~/lineage
          mkdir -p ~/lineage/tmp
          export TMPDIR=$HOME/lineage/tmp

          echo "=== Disk BEFORE build ==="
          df -h /
          echo "=== Memory BEFORE build ==="
          free -h
          echo "=== Swap ==="
          swapon --show

          source build/envsetup.sh
          lunch lineage_X6525-userdebug

          # Periodic status check in background
          ( while true; do \
              echo "=== $(date +%H:%M:%S) ==="; \
              df -h / | tail -1; \
              free -h | head -2 | tail -1; \
              sleep 120; \
            done ) &
          MONITOR_PID=$!

          # NO ccache, -j2 build
          mka vendor_bootimage -j2

          kill $MONITOR_PID 2>/dev/null || true

          echo "=== Disk AFTER build ==="
          df -h /
          echo "=== Memory AFTER build ==="
          free -h

      # ==========================================
      # STEP 13: List outputs (always)
      # ==========================================
      - name: List build outputs
        if: always()
        run: |
          echo "=== Build outputs ==="
          ls -la ~/lineage/out/target/product/X6525/*.img 2>/dev/null || echo "No .img files found"
          echo ""
          echo "=== All files in out dir ==="
          find ~/lineage/out/target/product/X6525 -maxdepth 1 -type f 2>/dev/null | head -30
          echo ""
          echo "=== Final disk ==="
          df -h /

      # ==========================================
      # STEP 14: Upload vendor_boot.img
      # ==========================================
      - name: Upload vendor_boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-X6525-vendor_boot
          path: ~/lineage/out/target/product/X6525/vendor_boot.img
          if-no-files-found: warn
          retention-days: 14

      # ==========================================
      # STEP 15: Upload build logs (always)
      # ==========================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/lineage/out/verbose.log.gz
            ~/lineage/out/error.log
          if-no-files-found: ignore
          retention-days: 7
