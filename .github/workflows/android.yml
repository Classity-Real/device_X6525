name: Build Lineage Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Extra aggressive cleanup
        run: |
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf /usr/share/swift 2>/dev/null || true
          sudo rm -rf /usr/share/miniconda 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/local/aws-cli 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoclean
          echo "=== Disk after cleanup ==="
          df -h /
          df -i /
          echo "=== Memory ==="
          free -h
          echo "=== Swap ==="
          swapon --show

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-11-jdk
          df -h /

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git and ccache
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=20G" >> $GITHUB_ENV
          echo "TMPDIR=$HOME/lineage/tmp" >> $GITHUB_ENV
          echo "TEMP=$HOME/lineage/tmp" >> $GITHUB_ENV
          echo "TMP=$HOME/lineage/tmp" >> $GITHUB_ENV

      # ==========================================
      # CACHING DISABLED FOR FIRST CLEAN BUILD
      # Re-enable after one successful build
      # ==========================================
      # - name: Cache repo
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/lineage/.repo
      #       ~/lineage/.repo/projects
      #       ~/lineage/.repo/project-objects
      #     key: reposync-lineage20-v3
      #     restore-keys: reposync-lineage20-
      #
      # - name: Cache ccache
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ccache
      #     key: ccache-lineage20-v3
      #     restore-keys: ccache-lineage20-

      - name: Init LineageOS 20.0
        run: |
          mkdir -p ~/lineage/tmp
          cd ~/lineage
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-tags

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: _device_tree

      - name: Place device tree
        run: |
          mkdir -p ~/lineage/device/infinix/X6525
          cp -a _device_tree/. ~/lineage/device/infinix/X6525/
          echo "=== Device tree files ==="
          ls -la ~/lineage/device/infinix/X6525/

      - name: Sync sources
        run: |
          cd ~/lineage
          mkdir -p ~/lineage/tmp
          export TMPDIR=$HOME/lineage/tmp

          echo "=== Disk before sync ==="
          df -h /
          df -i /

          repo sync -c -j4 \
            --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune || \
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

          echo "=== Disk after sync ==="
          df -h /
          echo "=== .repo size ==="
          du -sh .repo/

      - name: Prepare kernel
        run: |
          cd ~/lineage/device/infinix/X6525/prebuilts
          if [ -f kernel.gz ]; then
            echo "Decompressing kernel.gz..."
            gunzip -f kernel.gz
          fi
          echo "=== prebuilts contents ==="
          ls -la
          echo "=== kernel type ==="
          file kernel || true
          echo "=== dtb type ==="
          file dtb.img || true
          echo "=== dtbo type ==="
          file dtbo.img || true
          echo "=== modules count ==="
          ls modules_recovery_ramdisk/*.ko 2>/dev/null | wc -l

      - name: Build Lineage Recovery
        run: |
          cd ~/lineage
          mkdir -p ~/lineage/tmp
          export TMPDIR=$HOME/lineage/tmp

          echo "=== Disk before build ==="
          df -h /
          echo "=== Memory before build ==="
          free -h
          echo "=== Swap ==="
          swapon --show

          source build/envsetup.sh
          ccache -M 20G
          ccache -z
          lunch lineage_X6525-userdebug

          # Monitor memory every 60s in background
          ( while true; do \
              echo "=== $(date +%H:%M:%S) memory ==="; \
              free -h | head -2 | tail -1; \
              sleep 60; \
            done ) &
          MONITOR_PID=$!

          # Build with -j1 for low memory usage
          mka vendor_bootimage -j1

          kill $MONITOR_PID 2>/dev/null || true

          echo "=== Disk after build ==="
          df -h /
          echo "=== Memory after build ==="
          free -h

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build outputs ==="
          ls -la ~/lineage/out/target/product/X6525/*.img 2>/dev/null || echo "No .img files found"
          echo ""
          echo "=== Full out dir ==="
          find ~/lineage/out/target/product/X6525 -maxdepth 1 -type f 2>/dev/null | head -30
          echo ""
          echo "=== Final disk ==="
          df -h /

      - name: Upload vendor_boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-X6525-vendor_boot
          path: ~/lineage/out/target/product/X6525/vendor_boot.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/lineage/out/verbose.log.gz
            ~/lineage/out/error.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show ccache stats
        if: always()
        run: ccache -s
